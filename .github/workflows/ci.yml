# The gate that did not exist. Both hosts auto-deploy from `main` — Vercel the
# frontend, Render the backend — so until now a commit that broke the build or
# the suite shipped, and the first signal was the live site.
#
# Deliberately runs only the offline suites. `pytest -m live` costs Gemini quota
# (8 calls out of a free-tier budget of 20 per DAY), `-m network` reaches third
# parties, and `-m model` downloads ~80 MB. All three are excluded by default in
# pytest.ini; CI keeps that default rather than overriding it. Run them locally
# after touching ai/ or ingestion/, as CLAUDE.md says.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # No GEMINI_API_KEY is set, and that is a test in itself: every Gemini
      # caller must degrade rather than fail without one.
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The build is the half a test suite cannot cover: Vercel runs exactly
      # this, so a broken import or a bad Tailwind config fails here instead of
      # on the deployed site.
      - run: npm run build
